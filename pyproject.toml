[project]
name = "ai-job-seeker-workspace"
version = "0.1.0"
description = "Multi-implementation workspace — job-selection management facets (job_seeker + future aspects)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ai-job-seeker",
    "contract-search",
]

[tool.uv.workspace]
members = ["implementation/job_seeker", "implementation/contract_search"]

[tool.uv.sources]
ai-agent-core = { git = "https://github.com/paterake/ai_agent_core.git", rev = "79ee2f696f4e22f8acdab041078397655d4d6d20", subdirectory = "implementation/ai_agent_core" }
ai-job-seeker = { workspace = true }
contract-search = { workspace = true }

[tool.pytest.ini_options]
cache_dir = ".ignore/.pytest_cache"
addopts = ["--import-mode=importlib"]
pythonpath = ["implementation/job_seeker/src", "implementation/contract_search/src"]

schema_version: 1
tools:
  - name: harness-gov-audit
    description: Governance self-audit — detects contradictions between declared policy and required artefacts, missing mandatory registries, and expired exceptions
    owner: pco-owner
    evidence: ai_agent_pco scripts/distill_harness.py
    schema_version: "1.0.0"
    risk_tier: low
    requires_approval: false
    scope: pco-only
    entitlements:
      roles: [any]
      environments: [any]
    invocation: "from ai_agent_pco: uv run python3 scripts/distill_harness.py governance-audit --repo <repo>"

  - name: harness-gov-validate
    description: PCO conformance and harness wiring validation (what each check covers is in the PCO repo's RUNBOOK → Checks)
    owner: pco-owner
    evidence: ai_agent_pco scripts/distill_harness.py, scripts/validate_harness_wiring.py
    schema_version: "1.0.0"
    risk_tier: low
    requires_approval: false
    scope: pco-only
    entitlements:
      roles: [any]
      environments: [any]
    invocation: "from ai_agent_pco: uv run python3 scripts/distill_harness.py governed-repo-validate --repo <repo> && uv run python3 scripts/validate_harness_wiring.py --target <repo>"

mcp_servers: []

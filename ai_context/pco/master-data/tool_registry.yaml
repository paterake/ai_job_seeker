schema_version: 1
tools:
  - name: harness-gov-audit
    description: Governance self-audit — detects contradictions between declared policy and required artefacts, missing mandatory registries, and expired exceptions
    owner: pco-owner
    evidence: scripts/distill_harness.py
    schema_version: "1.0.0"
    risk_tier: low
    requires_approval: false
    scope: pco-only
    entitlements:
      roles: [any]
      environments: [any]
    invocation: "uv run python3 scripts/distill_harness.py governance-audit --repo ."

  - name: harness-gov-validate
    description: PCO conformance and harness wiring validation — registries, exception expiry, markdown links (governed-repo-validate) plus dotfolder symlinks, settings hook wiring and entrypoints (validate_harness_wiring.py). The `validate` subcommand is consumer parity + REPO_CONTRACT shape (consumers only); on the PCO it compares the source with itself
    owner: pco-owner
    evidence: scripts/distill_harness.py
    schema_version: "1.0.0"
    risk_tier: low
    requires_approval: false
    scope: pco-only
    entitlements:
      roles: [any]
      environments: [any]
    invocation: "uv run python3 scripts/distill_harness.py governed-repo-validate --repo . && uv run python3 scripts/validate_harness_wiring.py --target ."

mcp_servers: []

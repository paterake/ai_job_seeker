schema_version: 1

# Read by ai_harness/hooks/check_data_guard.sh. The gate holds no types, patterns or paths of its own.
# The patterns are a heuristic tripwire (extended regular expressions, matched line by line), not a PII detector.

# Denied by file extension, case-insensitive, without opening the file.
office_types: [xlsx, xlsm, xls, docx, docm, doc, pptx, ppt]

# Files larger than this are not scanned.
max_scan_bytes: 5242880

patterns:
  email: '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}'
  phone: '(^|[^0-9])(\+[0-9]{1,3}[ .-])?(\([0-9]{3}\)[ .-]?|[0-9]{3}[ .-])[0-9]{3}[ .-][0-9]{4}([^0-9]|$)'
  national_id: '(^|[^0-9-])[0-9]{3}-[0-9]{2}-[0-9]{4}([^0-9-]|$)'
  card_number: '(^|[^0-9])[0-9]{4}[ -][0-9]{4}[ -][0-9]{4}[ -][0-9]{4}([^0-9]|$)'

# A file is passed unscanned when its path matches a glob; a match is ignored when it equals a string exactly.
allowlist:
  paths: []
  strings: []

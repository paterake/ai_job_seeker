# LLM-authoring backend for the judgment steps (match scoring, drafting),
# plus profile-level defaults that the pipeline stages consume.
# The pipeline is otherwise deterministic — only LLM steps swap.
# Consumed by ai_job_seeker.backend → ai_agent_core.execution (tri-mode shared lib).
#
# Exactly one backend is active per run. Precedence when flags are passed:
#   --llm-provider/--llm-model  -> cloud   (opt-in; requires BOTH)
#   --ollama-model              -> local
#   (neither)                   -> agent   (default: the coding agent authors in-session, no API key)
#
# Secrets never live here. Cloud keys come from --llm-api-key-file/--llm-api-key-dir or process.yaml in
# --config-dir (ai_agent_core reads no environment variable); see docs/CONFIGURATION.md.
# Candidate PII (the profile YAML, draft output) lives under gitignored paths — this file
# carries pointers only, never CV content or profile facts.

default_mode: agent          # agent | local | cloud
                             # HARDWARE CONSTRAINT (Kiera's M3 Air 8GB): local Ollama is too heavy
                             # for this machine — keep agent as the default and only ever use
                             # --ollama-model / local mode on a bigger box. Cloud mode remains
                             # opt-in only (--llm-provider + --llm-model, or fill cloud section).

local:
  model: ""                  # e.g. "llama3.1" — set to enable local without a flag
  base_url: "http://localhost:11434"
  timeout_s: 300.0

cloud:
  provider: ""               # e.g. "anthropic" — opt-in only, never defaulted
  model: ""                  # e.g. "claude-opus-5"
  # api key resolved by ai_agent_core from a key file, not stored here; cloud also needs --llm-base-url

# Profile-level defaults (mechanism, not facts). Draft stage + CV→YAML helpers use cv_dir
# as the default location for the raw .docx/.pdf source CVs. Paths are resolved verbatim —
# may be absolute (recommended, since CVs live outside the repo for PII separation) or
# relative to the workspace root.
profile:
  cv_dir: "/Users/kierapatel/Documents/__personal/careers/cv"
  # Expected filename stems inside cv_dir. Stage-4 draft and any CV→profile converter
  # will look for these and fall back to whatever *.docx exists if the names don't match.
  cv_docx_stem: "Kiera_Patel_CV"
  cv_pdf_stem: "Kiera_Patel_CV"

# Secret lookup root (a path, not a secret). Keys are read from <apikey_root>/<service>/<file>,
# falling back to environment variables. Lives outside the repo; `~` is expanded.
secrets:
  apikey_root: "~/Documents/__cfg/apikey"

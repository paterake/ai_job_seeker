# Hard-block exclusion rules for the match pipeline.
# Kiera (English-only History BA, zero engineering background, graduate entry-level).
#
# Design notes — WHY this is config-driven:
#   * Code should encode MECHANISM (phrase matching, geo allow-lists), not DATA.
#   * Every time Kiera says "oh, XYZ roles are also silly" we just edit this YAML
#     instead of touching Python source. No PR/commit required for list tweaks.
#   * Per-section overrides live cleanly here if ever needed (e.g. Section G
#     teaching exclusions could be extended independently of marketing exclusions).
#   * The loader in `match.deterministic` does ONE read-on-import + re-exports the
#     same public surface as before, so CLI, build script and tests are unchanged.
#
# All values match CASE-INSENSITIVE against whitespace-tokenised title + description.
# Prefix/postfix word boundaries are added at match time, so e.g. "data engineer"
# matches "Graduate Data Engineer" but NOT "data entry clerk engineer".
#
# Keep each list sorted alphabetically for easy grep/diff.


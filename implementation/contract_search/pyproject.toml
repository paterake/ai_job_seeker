[project]
name = "contract-search"
version = "0.1.0"
description = "Contract-role search: live ingest via ai_job_seeker, then a config-driven scorer for contract, IR35 and remote signals."
requires-python = ">=3.11,<3.14"
dependencies = [
    "ai-job-seeker",
    "pyyaml>=6.0",
    "requests>=2.32.0",
]

[project.scripts]
contract-search = "contract_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contract_search"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
